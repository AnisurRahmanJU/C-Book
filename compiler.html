<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C Compiler Workspace</title>
  
  <!-- CodeMirror CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  
  <style>
    :root{
      --bg:#0f1419; --panel:#161c24; --panel-2:#1b232d; --line:#26303c;
      --text:#dfe6ee; --muted:#8593a3; --accent:#3fb8af; --accent-ink:#04211f;
      --danger:#ff6b6b; --warn:#f5c26b; --ok:#7ee0a3;
      --sans:'Inter',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
    }
    :root[data-theme="light"]{
      --bg:#eef1f5; --panel:#ffffff; --panel-2:#f4f6f9; --line:#dbe1e8;
      --text:#1c2530; --muted:#66758a; --accent:#0f8f86; --accent-ink:#ffffff;
      --danger:#d6303a; --warn:#a86a00; --ok:#1a8a4a;
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0}
    body{
      background:var(--bg); color:var(--text); font-family:var(--sans);
      display:flex; flex-direction:column; overflow:hidden;
      padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    }
    button,select,input,textarea{font-family:inherit}
    :focus-visible{outline:2px solid var(--accent); outline-offset:2px}
    
    /* Top bar */
    .topbar{
      display:flex; align-items:center; gap:10px; padding:10px 14px;
      background:var(--panel); border-bottom:1px solid var(--line); flex-wrap:wrap;
    }
    .brand{display:flex; align-items:center; gap:10px; font-weight:700; letter-spacing:-.2px; margin-right:6px}
    .brand .mark{
      width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);
      display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:1rem;
    }
    .brand small{color:var(--muted);font-weight:500;font-size:.75rem;display:block;margin-top:-2px}
    .spacer{flex:1}
    .tool,.select{
      background:var(--panel-2); color:var(--text); border:1px solid var(--line);
      border-radius:8px; padding:7px 12px; font-size:.85rem; font-weight:500; cursor:pointer;
    }
    .tool:hover,.select:hover{border-color:var(--muted)}
    .run{
      background:var(--accent); color:var(--accent-ink); border:none; border-radius:8px;
      padding:8px 18px; font-weight:700; font-size:.9rem; cursor:pointer;
      display:flex; align-items:center; gap:8px;
    }
    .run:hover{filter:brightness(1.08)}
    .run:disabled{opacity:.6;cursor:wait}
    .run kbd{font-family:var(--mono);font-size:.68rem;background:rgba(0,0,0,.18);padding:2px 6px;border-radius:5px;font-weight:500}
    
    /* Workspace */
    .workspace{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(320px,1fr);gap:1px;background:var(--line)}
    .pane{background:var(--panel);display:flex;flex-direction:column;min-width:0;min-height:0}
    .pane-head{
      display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--panel-2);
      border-bottom:1px solid var(--line);font-size:.8rem;color:var(--muted);font-weight:600;flex-shrink:0;
    }
    .pane-head .file{color:var(--text);font-family:var(--mono);font-weight:500}
    .pane-head .right{margin-left:auto;display:flex;gap:6px;align-items:center}
    .mini{background:transparent;border:1px solid var(--line);color:var(--muted);border-radius:6px;width:26px;height:26px;cursor:pointer;font-weight:700}
    .mini:hover{color:var(--text);border-color:var(--muted)}
    .editor-wrap{flex:1;min-height:0;position:relative}
    .CodeMirror{position:absolute;inset:0;height:auto;font-family:var(--mono);font-size:14px;line-height:1.6;background:var(--panel);color:var(--text)}
    .CodeMirror-gutters{background:var(--panel);border-right:1px solid var(--line)}
    .CodeMirror-linenumber{color:var(--muted);opacity:.7}
    .CodeMirror-cursor{border-left:2px solid var(--accent)}
    .CodeMirror-activeline-background{background:rgba(127,150,175,.09)}
    .CodeMirror-selected{background:rgba(63,184,175,.25)!important}
    .CodeMirror-matchingbracket{color:var(--accent)!important;border-bottom:1px solid var(--accent)}
    .cm-s-cc .cm-keyword{color:#e5809b;font-weight:600}
    .cm-s-cc .cm-type,.cm-s-cc .cm-variable-3{color:#6cc7ff}
    .cm-s-cc .cm-def{color:#8fb8ff}
    .cm-s-cc .cm-string{color:#e8c072}
    .cm-s-cc .cm-number{color:#c69cff}
    .cm-s-cc .cm-comment{color:#6d7b8b;font-style:italic}
    .cm-s-cc .cm-meta{color:#5fd0c6}
    .cm-s-cc .cm-operator{color:#5fd0c6}
    .cm-s-cc .cm-atom,.cm-s-cc .cm-builtin{color:#7ee0a3}
    :root[data-theme="light"] .cm-s-cc .cm-keyword{color:#c0245a}
    :root[data-theme="light"] .cm-s-cc .cm-type,:root[data-theme="light"] .cm-s-cc .cm-variable-3{color:#0b6fb8}
    :root[data-theme="light"] .cm-s-cc .cm-def{color:#2a52c9}
    :root[data-theme="light"] .cm-s-cc .cm-string{color:#946200}
    :root[data-theme="light"] .cm-s-cc .cm-number{color:#7b3fd1}
    :root[data-theme="light"] .cm-s-cc .cm-comment{color:#8794a3}
    :root[data-theme="light"] .cm-s-cc .cm-meta,:root[data-theme="light"] .cm-s-cc .cm-operator{color:#0a7f76}
    .err-line{background:rgba(255,107,107,.18)}
    
    /* Right column */
    .side{display:grid;grid-template-rows:minmax(90px,.55fr) minmax(0,1.6fr);gap:1px;background:var(--line);min-height:0}
    textarea#stdin{
      flex:1;min-height:0;resize:none;border:0;outline:0;background:var(--panel);color:var(--warn);
      font-family:var(--mono);font-size:13px;padding:12px 14px;line-height:1.6;
    }
    textarea#stdin::placeholder{color:var(--muted)}
    #output{
      flex:1;min-height:0;margin:0;padding:12px 14px;overflow:auto;background:var(--panel);
      font-family:var(--mono);font-size:13px;line-height:1.6;white-space:pre-wrap;word-break:break-word;color:var(--text);
    }
    #output .err{color:var(--danger)}
    #output .hint{color:var(--muted)}
    .status{
      display:flex;align-items:center;gap:14px;padding:6px 14px;background:var(--panel-2);border-top:1px solid var(--line);
      font-size:.75rem;color:var(--muted);flex-shrink:0;
    }
    .dot{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block;margin-right:6px}
    .dot.ok{background:var(--ok)} .dot.bad{background:var(--danger)} .dot.run{background:var(--warn)}
    
    .note{font-size:.72rem;color:var(--muted);padding:6px 14px;border-top:1px solid var(--line);background:var(--panel-2);flex-shrink:0}
    .note code{font-family:var(--mono)}
    
    @media(max-width:860px){
      body{overflow:auto}
      .workspace{grid-template-columns:1fr;flex:none}
      .pane.editor{height:60vh}
      .side{height:70vh}
      .brand small{display:none}
    }
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>
<body>

  <!-- Top bar -->
  <header class="topbar">
    <div class="brand">
      <div class="mark">C</div>
      <div>
        <span>Compiler</span>
        <small>Workspace</small>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="tool" id="themeToggle">Theme</button>
    <button class="run" id="runBtn">Run <kbd>Ctrl+Enter</kbd></button>
  </header>

  <!-- Workspace -->
  <main class="workspace">
    <!-- Left Pane: Code Editor -->
    <section class="pane editor">
      <div class="pane-head">
        <span>Editing:</span>
        <span class="file">main.c</span>
        <div class="right">
          <button class="mini" id="resetBtn" title="Reset Code">⟳</button>
        </div>
      </div>
      <div class="editor-wrap">
        <textarea id="codeEditor">#include <stdio.h>

int main() {
    printf("Hello, World!\n");
    return 0;
}</textarea>
      </div>
    </section>

    <!-- Right Pane: Stdin & Output -->
    <section class="side">
      <div class="pane" style="display:flex;flex-direction:column;min-height:0;">
        <div class="pane-head"><span>Standard Input (stdin)</span></div>
        <textarea id="stdin" placeholder="Enter input values here..."></textarea>
      </div>
      <div class="pane" style="display:flex;flex-direction:column;min-height:0;">
        <div class="pane-head">
          <span>Output Console</span>
          <div class="right"><span class="dot ok" id="statusDot"></span><span id="statusText">Ready</span></div>
        </div>
        <pre id="output"><span class="hint">Program output will appear here...</span></pre>
      </div>
    </section>
  </main>

  <!-- Footer status note -->
  <div class="note">
    Tip: Press <code>Ctrl + Enter</code> to quickly run your C program.
  </div>

  <!-- CodeMirror JS Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>

  <script>
    // CodeMirror ইনিশিয়ালাইজেশন
    const editor = CodeMirror.fromTextArea(document.getElementById('codeEditor'), {
      mode: "text/x-csrc",
      theme: "cc",
      lineNumbers: true,
      autoCloseBrackets: true,
      matchBrackets: true,
      tabSize: 4,
      indentUnit: 4
    });

    // থিম টগল করার ফাংশন
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
      const html = document.documentElement;
      const currentTheme = html.getAttribute('data-theme');
      html.setAttribute('data-theme', currentTheme === 'light' ? 'dark' : 'light');
    });

    // রান বাটন বা শর্টকাট ইভেন্ট (Ctrl + Enter)
    const runBtn = document.getElementById('runBtn');
    const output = document.getElementById('output');
    const statusDot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    function executeCode() {
      const code = editor.getValue();
      const input = document.getElementById('stdin').value;
      
      // স্ট্যাটাস পরিবর্তন
      statusDot.className = "dot run";
      statusText.textContent = "Running...";
      output.innerHTML = '<span class="hint">Compiling and running...</span>';

      // এখানে আপনার ব্যাকএন্ড বা কম্পাইলার API ইন্টিগ্রেট করতে পারেন। 
      // উদাহরণস্বরূপ সিম্যুলেশন:
      setTimeout(() => {
        statusDot.className = "dot ok";
        statusText.textContent = "Success";
        output.textContent = "Hello, World!\n(Simulation output: Connect your backend API here to execute real C code)";
      }, 800);
    }

    runBtn.addEventListener('click', executeCode);

    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        e.preventDefault();
        executeCode();
      }
    });

    // রিসেট বাটন
    document.getElementById('resetBtn').addEventListener('click', () => {
      editor.setValue(`#include <stdio.h>

int main() {
    printf("Hello, World!\\n");
    return 0;
}`);
    });
  </script>
</body>
</html>
